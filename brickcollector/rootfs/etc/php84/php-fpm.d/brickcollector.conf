; Пул для BrickCollector. Базовый www отключён в install.sh, чтобы не спорил за
; тот же порт.
[brickcollector]
listen = 127.0.0.1:9000
; Аддон работает от root, как и всё в контейнере Home Assistant: база и кэш
; картинок лежат в /config, который принадлежит root. php-fpm отказывается
; запускать пул от root, если ему явно не сказать -R, — сказано в start.sh.
user = root
group = root

; Аддон живёт на домашнем железе, в том числе на Raspberry Pi: держим немного
; готовых процессов и не даём пулу разрастаться.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Без этого php-fpm вычищает окружение воркеров, и приложение не узнает ни где
; лежит база, ни что ему разрешено верить заголовку Ingress.
clear_env = no

; Импорт справочника — 175 тысяч предметов и полтора миллиона строк инвентаря;
; на слабой машине это минуты и сотня мегабайт.
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 600

catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
