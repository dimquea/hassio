# BrickCollector под Home Assistant.
#
# Два входа на одно приложение. 8099 — для Ingress: туда ходит только сам Home
# Assistant, и заголовку X-Ingress-Path, которым он сообщает свой префикс,
# можно верить. 8100 — прямой доступ: Supervisor выставляет его наружу, только
# если в разделе «Сеть» вписали порт. Там заголовок мог бы прислать кто угодно
# и переписать им все ссылки на странице, поэтому он стирается, и приложение
# живёт от корня.
#
# Флаг доверия заголовку один на всё приложение — конфиг кэшируется при старте,
# — поэтому вход различается не флагом, а тем, доходит ли заголовок вообще.

user root;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Картинки отдаются приложением, каталог импортируется долго: короткий
    # таймаут превратил бы первый импорт в 504.
    fastcgi_read_timeout 600;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8099 default_server;
        server_name _;

        # Ingress приходит только из сети Supervisor. Порт и так не выставлен,
        # но с соседним, открытым, это дешёвая страховка.
        allow 172.30.32.2;
        deny all;

        set $ingress_path $http_x_ingress_path;

        include /etc/nginx/brickcollector.conf;
    }

    server {
        listen 8100;
        server_name _;

        # Пустая строка, а не заголовок клиента: параметр, заданный явно,
        # nginx не дублирует тем, что прислали в запросе.
        set $ingress_path "";

        include /etc/nginx/brickcollector.conf;
    }
}
