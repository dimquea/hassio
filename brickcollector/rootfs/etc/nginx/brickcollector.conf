# Приложение — одинаковое для обоих входов. Различаются они только
# $ingress_path, который задаёт каждый server перед этим include.

root /app/public;
index index.php;

client_max_body_size 32m;

# Собранные ассеты именуются по содержимому, поэтому их можно кэшировать
# надолго: смена сборки меняет имя файла.
location /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    include /etc/nginx/fastcgi.conf;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    # Приложению разрешено верить префиксу. Откуда он берётся — решает
    # server: под Ingress это заголовок Home Assistant, на прямом входе —
    # пустая строка.
    fastcgi_param BRICKCOLLECTOR_TRUST_INGRESS true;
    fastcgi_param HTTP_X_INGRESS_PATH $ingress_path;
}

location ~ /\. {
    deny all;
}
