name: BrickCollector
version: 1.8.0.0
description: Self-hosted LEGO collection manager backed by the BrickLink catalog.
url: https://github.com/dimquea/hassio/tree/main/brickcollector
slug: brickcollector
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# The Home Assistant panel is the way in. Direct access is off unless a host
# port is entered under Network: the add-on has no authentication of its own,
# so whoever reaches that port reaches the whole collection. It is there for
# what the panel cannot do — the camera, which a page inside the panel's frame
# is not allowed to use.
ingress: true
ingress_port: 8099
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Direct access, without Home Assistant and without a login (home network only)
panel_icon: mdi:toy-brick
panel_title: BrickCollector
panel_admin: false
map:
  - app_config:rw
options:
  locale: ru
  currency: RUB
  log_level: warning
  import_catalog: true
  fetch_images: true
  fetch_batch: 200
  fetch_interval: 300
  catalog_url: >-
    https://github.com/rgriebl/brickstore-database/releases/latest/download/downloads.zip
schema:
  locale: list(en|ru)
  currency: str
  log_level: list(debug|info|notice|warning|error|fatal)
  import_catalog: bool
  fetch_images: bool
  fetch_batch: int(10,1000)
  fetch_interval: int(30,86400)
  catalog_url: url
